name: Docker Image CI

on:
  schedule:
  - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild and publish the current version right away. Changes to the Dockerfile or the scripts are published by the next scheduled run on their own, this only skips the wait."
        type: boolean
        default: false

# Never run two of these at once: both would see the same tags on Docker Hub, pick the same
# revision number and push over each other.
concurrency:
  group: docker-image-ci
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout the latest version
        uses: actions/checkout@v7
        with:
          # The script dates the last change to the Dockerfile and the scripts from the git
          # history, which a shallow clone does not have.
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
    
      - name: Check the latest version and push new versions
        shell: bash
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          # make file runnable, might not be necessary
          chmod +x "${GITHUB_WORKSPACE}/scripts/get_updates.sh"

          # run script
          "${GITHUB_WORKSPACE}/scripts/get_updates.sh"