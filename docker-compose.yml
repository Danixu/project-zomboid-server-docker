version: "3.7"
services:
  ProjectZomboidDedicatedServer:
    image: danixu86/project-zomboid-dedicated-server:latest
    restart: unless-stopped
    # On SIGTERM the entrypoint sends `quit` to the server console and waits for the world
    # to be saved. Docker's default grace period is 10s, which is not enough for a large
    # world and would SIGKILL the server mid-save.
    stop_grace_period: 120s
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Reads STEAMAPPBRANCH from your .env file to set the build version (ARG).
        - STEAMAPPBRANCH=${STEAMAPPBRANCH}
    env_file:
      - .env
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    volumes:
      # Server data
      - ${PROJECT_ZOMBOID_DATA:-./data}:/home/steam/Zomboid
      # Workshop mods folder
      - ${PROJECT_ZOMBOID_WORKSHOP_MODS:-./workshop-mods}:/home/steam/pz-dedicated/steamapps/workshop
